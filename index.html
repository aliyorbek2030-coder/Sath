<style>
html{background:#F3F6FA;color-scheme:only light;overflow-x:hidden;overflow-x:clip}
body{max-width:100%;position:relative}
.hx,.mq,.ppband,.sstrip,.bx,footer.site{max-width:100%;overflow-x:clip}
html,body{overflow-x:clip}
:root{
  color-scheme:only light;
  --ground:#F3F6FA; --surface:#FFFFFF; --ink:#0E1B30; --muted:#5F6B7C; --line:#DCE3EC; --soft:#E8EEF5;
  --accent:#93692E; --accent-ink:#FFFFFF; --accent-soft:#EEF2F8; --danger:#B3261E; --gold:#E3C27E;
  --display:"Geologica","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;margin:0;-webkit-font-smoothing:antialiased}
a{color:inherit}
img,svg{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1320px;margin:0 auto;padding-inline:clamp(16px,4vw,48px)}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;line-height:1.08;letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:clamp(40px,7.2vw,104px);font-weight:300;letter-spacing:-.035em}
h2{font-size:clamp(30px,4.4vw,60px);font-weight:300;letter-spacing:-.03em}
h3{font-size:clamp(20px,2vw,26px)}
h4{font-size:18px;font-weight:600;letter-spacing:-.01em}
p{margin:0}
.lbl{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.prose{max-width:66ch;display:grid;gap:1em;font-size:17px}
.stack{display:grid;gap:16px}
.demo{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border:1px dashed currentColor;border-radius:2px;color:var(--muted);vertical-align:middle;white-space:nowrap}
.ph{font-family:var(--mono);font-size:.9em;color:var(--muted);border-bottom:1px dashed var(--muted)}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:var(--ground);text-decoration:none;font:500 15px/1 var(--body);padding:15px 22px;border:0;border-radius:0;cursor:pointer;transition:background .2s,color .2s}
.btn:hover{background:var(--accent);color:var(--accent-ink)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.btn.line:hover{background:var(--ink);color:var(--ground)}
.btn.acc{background:var(--accent);color:var(--accent-ink)}
.btn.acc:hover{background:var(--ink);color:var(--ground)}
.arrow{width:18px;height:10px;flex:none}
.tlink{font-weight:500;text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px;display:inline-flex;gap:8px;align-items:center}
.tlink:hover{border-color:var(--ink)}
hr.rule{border:0;border-top:1px solid var(--line);margin:0}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:28px;height:72px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;font:300 21px/1 var(--display);letter-spacing:.46em;white-space:nowrap}
.logo svg{width:26px;height:26px}
.nav{display:flex;gap:26px;margin-left:auto;font-size:14.5px}
.nav a{text-decoration:none;color:var(--muted);padding-block:6px;border-bottom:1px solid transparent}
.nav a:hover,.nav a[aria-current="page"]{color:var(--ink);border-color:var(--ink)}
.langs{display:flex;gap:2px;font-family:var(--mono);font-size:12px}
.langs button{background:none;border:0;color:var(--muted);padding:6px 6px;cursor:pointer;font:inherit;letter-spacing:.06em}
.langs button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.burger{display:none;background:none;border:0;width:44px;height:44px;margin-left:auto;cursor:pointer;color:var(--ink)}
.bar .btn{padding:12px 18px;font-size:14px}
@media (max-width:1080px){.nav,.bar>.langs,.bar>.btn{display:none}.burger{display:block}}
.menu{position:fixed;inset:0;z-index:60;background:var(--ground);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) clamp(16px,4vw,48px) calc(env(safe-area-inset-bottom,0px) + 24px);overflow:auto}
.menu .mhead{display:flex;justify-content:space-between;align-items:center;height:60px}
.menu nav{display:grid;margin-top:24px}
.menu nav a{font:300 clamp(30px,8vw,44px)/1.25 var(--display);text-decoration:none;letter-spacing:-.02em;padding-block:8px;border-bottom:1px solid var(--line);animation:slidein .35s both}
.menu .mfoot{margin-top:auto;padding-top:24px;display:grid;gap:16px}
@keyframes slidein{from{transform:translateY(10px)}to{transform:none}}

/* mobile action bar */
.mbar{display:none}
@media (max-width:760px){
  .mbar{display:grid;grid-template-columns:1fr 1fr;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
  .mbar a{color:var(--ground);text-decoration:none;text-align:center;padding:15px 8px;font-weight:500;font-size:15px}
  .mbar a+a{background:var(--accent);color:var(--accent-ink)}
  footer.site{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
}

main{min-height:60vh}
.view{animation:fadein .45s ease both}
@keyframes fadein{from{transform:translateY(8px)}to{transform:none}}
.rv{transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.rv.pre{transform:translateY(22px)}
@media (prefers-reduced-motion:reduce){.view,.menu nav a{animation:none}.rv,.rv.pre{transition:none;transform:none}}

section.sec{padding-block:clamp(64px,9vw,128px)}
.sechead{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;margin-bottom:clamp(32px,4vw,56px)}
.sechead .lbl{display:block;margin-bottom:14px}
@media (max-width:700px){.sechead{grid-template-columns:1fr}}

/* home hero */
.hero{padding-block:clamp(40px,6vw,80px) 0}
.hero h1{max-width:14ch}
.hero-row{display:grid;grid-template-columns:1fr auto;gap:32px;align-items:end;margin-top:28px}
.hero-row p{max-width:48ch;font-size:clamp(16px,1.4vw,19px);color:var(--muted)}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-art{margin-top:clamp(32px,4vw,56px);position:relative}
.hero-art .art{aspect-ratio:21/9}
.hero-art figcaption{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:12px}
@media (max-width:760px){.hero-row{grid-template-columns:1fr}.hero-art .art{aspect-ratio:4/3}}
.art{display:block;width:100%;max-width:100%;height:auto;background:var(--soft)}
.art svg{display:block;width:100%;height:100%}

/* project cards */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(28px,3vw,44px) clamp(16px,2vw,28px)}
.pgrid.two{grid-template-columns:repeat(2,1fr)}
@media (max-width:1000px){.pgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.pgrid,.pgrid.two{grid-template-columns:1fr}}
.pcard{text-decoration:none;display:grid;gap:14px}
.pcard .art{aspect-ratio:4/3;overflow:hidden;position:relative}
.pcard .art svg{transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.pcard:hover .art svg{transform:scale(1.035)}
.pcard .hov{position:absolute;inset:auto 0 0 0;padding:14px 16px;background:linear-gradient(transparent,rgba(10,14,13,.72));color:#F2F4F1;font-family:var(--mono);font-size:12px;display:flex;justify-content:space-between;gap:8px;transform:translateY(100%);transition:transform .35s}
.pcard:hover .hov,.pcard:focus-visible .hov{transform:none}
.pcard .meta{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.pcard h3{font-size:clamp(19px,1.7vw,23px)}
.pcard .sub{font-size:14px;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap}
.pgrid .pcard.wide{grid-column:span 2}
.pgrid .pcard.wide .art{aspect-ratio:16/9}
@media (max-width:600px){.pgrid .pcard.wide{grid-column:auto}.pgrid .pcard.wide .art{aspect-ratio:4/3}}

/* services list */
.slist{border-top:1px solid var(--ink)}
.srow{display:grid;grid-template-columns:72px 1.1fr 1.4fr 40px;gap:24px;align-items:center;padding-block:26px;border-bottom:1px solid var(--line);text-decoration:none;transition:background .25s,padding .25s}
.srow:hover{background:var(--surface);padding-inline:14px}
.srow .ic{width:48px;height:48px;color:var(--accent)}
.srow h3{font-size:clamp(20px,2.2vw,30px);font-weight:300}
.srow p{color:var(--muted);font-size:15px}
.srow .go{justify-self:end}
@media (max-width:760px){.srow{grid-template-columns:44px 1fr 24px;gap:14px}.srow p{grid-column:2/3}.srow .ic{width:34px;height:34px}.srow .go{grid-row:1;grid-column:3}}

/* about teaser */
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,6vw,96px);align-items:start}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.nums{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);margin-top:48px}
.nums div{padding:22px 16px 0 0;display:grid;gap:6px}
.nums b{font:300 clamp(36px,4vw,56px)/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.nums span{font-size:14px;color:var(--muted)}
@media (max-width:700px){.nums{grid-template-columns:1fr 1fr;row-gap:24px}}

/* approach */
.approach{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line)}
.approach div{padding:28px 28px 32px 0;border-bottom:1px solid var(--line);display:grid;gap:10px;align-content:start}
.approach div:nth-child(3n+2),.approach div:nth-child(3n+3){padding-left:28px;border-left:1px solid var(--line)}
.approach p{color:var(--muted);font-size:15px}
@media (max-width:900px){.approach{grid-template-columns:1fr}.approach div,.approach div:nth-child(n){padding:24px 0;border-left:0}}

/* process */
.proc{display:grid;grid-template-columns:repeat(6,1fr);gap:0}
.proc li{list-style:none;padding:0 18px 0 0;display:grid;gap:10px;align-content:start}
.proc .k{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.proc .k::after{content:"";flex:1;border-top:1px solid var(--line)}
.proc li:last-child .k::after{border-color:var(--accent);border-top-width:2px}
.proc h4{font-size:17px}
.proc p{font-size:14px;color:var(--muted)}
ol.proc{padding:0;margin:0}
@media (max-width:1000px){.proc{grid-template-columns:repeat(3,1fr);row-gap:36px}}
@media (max-width:560px){.proc{grid-template-columns:1fr 1fr}}

/* trust */
.logos{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.logos div{aspect-ratio:3/2;display:grid;place-items:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:11px;text-align:center;padding:8px}
@media (max-width:760px){.logos{grid-template-columns:repeat(3,1fr)}}

/* journal */
.jgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
@media (max-width:900px){.jgrid{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.jgrid{grid-template-columns:1fr}}
.jcard{text-decoration:none;display:grid;gap:12px;align-content:start}
.jcard .art{aspect-ratio:3/2;overflow:hidden}
.jcard .m{display:flex;gap:12px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.jcard h3{font-size:21px}
.jcard p{font-size:15px;color:var(--muted)}
.jcard:hover h3{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}

/* CTA + form */
.cta-block{background:var(--surface);border-block:1px solid var(--line)}
.cta-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(32px,6vw,96px)}
@media (max-width:900px){.cta-grid{grid-template-columns:1fr}}
.direct{display:grid;gap:18px;margin-top:36px}
.direct div{display:grid;gap:2px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.direct .v{font-size:18px}
form.lead{display:grid;gap:18px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:560px){.frow{grid-template-columns:1fr}}
.fld{display:grid;gap:6px}
.fld>span{font-size:13.5px;font-weight:500}
.fld>span i{font-style:normal;color:var(--accent)}
.fld input,.fld select,.fld textarea{font:inherit;font-size:16px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 0;width:100%}
.fld select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 12px) 55%,calc(100% - 7px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.fld select option{background:var(--surface);color:var(--ink)}
.fld textarea{min-height:96px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-bottom:2px solid var(--accent);padding-bottom:9px}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-bottom-color:var(--danger)}
.fld .e{font-size:12.5px;color:var(--danger)}
.file{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px}
.file label{cursor:pointer;border:1px dashed var(--muted);padding:10px 14px}
.file input{position:absolute;width:1px;height:1px;opacity:0}
.check{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;color:var(--muted)}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.done{border:1px solid var(--accent);background:var(--accent-soft);padding:22px;display:grid;gap:8px}
.done h4{display:flex;gap:10px;align-items:center}

/* page head */
.phead{padding-block:clamp(40px,6vw,88px) clamp(28px,4vw,56px)}
.crumbs{display:flex;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:28px}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--ink)}
.phead .intro{margin-top:24px;max-width:60ch;font-size:clamp(16px,1.4vw,19px);color:var(--muted)}

/* filters */
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) minmax(0,1.3fr);gap:16px;padding-block:20px;border-block:1px solid var(--line);margin-bottom:40px}
.filters .fld select,.filters .fld input{font-size:15px}
.fcount{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:-20px 0 32px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.fcount button{background:none;border:0;color:var(--ink);text-decoration:underline;cursor:pointer;font:inherit}
@media (max-width:1000px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.filters .fld:last-child{grid-column:1/-1}}
.empty{padding:48px 0;text-align:left;color:var(--muted)}

/* project page */
.facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);margin:0}
.facts div{padding:16px 16px 18px 0;border-bottom:1px solid var(--line)}
.facts dt{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:4px 0 0;font-size:17px;font-variant-numeric:tabular-nums}
@media (max-width:760px){.facts{grid-template-columns:1fr 1fr}}
.chapter{display:grid;grid-template-columns:260px 1fr;gap:32px;padding-block:36px;border-top:1px solid var(--line)}
@media (max-width:760px){.chapter{grid-template-columns:1fr;gap:12px}}
.gallery{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.gallery button{padding:0;border:0;background:none;cursor:zoom-in;display:block}
.gallery button:nth-child(6n+1){grid-column:span 4}
.gallery button:nth-child(6n+2){grid-column:span 2}
.gallery button:nth-child(6n+3),.gallery button:nth-child(6n+4),.gallery button:nth-child(6n+5){grid-column:span 2}
.gallery button:nth-child(6n){grid-column:span 6}
.gallery .art{aspect-ratio:4/3}
.gallery button:nth-child(6n+1) .art{aspect-ratio:auto;height:100%}
.gallery button:nth-child(6n) .art{aspect-ratio:21/9}
@media (max-width:700px){.gallery{grid-template-columns:1fr 1fr}.gallery button:nth-child(n){grid-column:span 1}.gallery button:nth-child(3n+1){grid-column:span 2}.gallery button:nth-child(n) .art{aspect-ratio:4/3;height:auto}}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.plans figure{margin:0;border:1px solid var(--line);background:var(--surface)}
.plans figcaption{padding:10px 14px;border-top:1px solid var(--line)}
@media (max-width:700px){.plans{grid-template-columns:1fr}}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tags a,.tags span{font-size:13.5px;text-decoration:none;border:1px solid var(--line);padding:6px 12px;border-radius:40px}
.tags a:hover{border-color:var(--ink)}
.lb{position:fixed;inset:0;z-index:80;background:rgba(8,10,10,.94);display:grid;grid-template-rows:auto 1fr auto;color:#EEF0ED;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px calc(env(safe-area-inset-bottom,0px) + 12px)}
.lb .lbtop{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;height:48px}
.lb button{background:none;border:0;color:inherit;cursor:pointer;font:inherit;padding:10px}
.lb .stage{display:grid;place-items:center;min-height:0}
.lb .stage .art{max-width:min(100%,1200px);max-height:100%;aspect-ratio:4/3;width:auto;height:100%}
.lb .nav2{display:flex;justify-content:center;gap:24px}

/* service page */
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
@media (max-width:860px){.cols3{grid-template-columns:1fr}}
.ilist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.ilist li{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:32px 1fr;gap:8px}
.ilist li::before{content:"";width:10px;height:10px;margin-top:8px;border:1px solid var(--accent);transform:rotate(45deg)}
details.faq{border-bottom:1px solid var(--line)}
details.faq summary{cursor:pointer;list-style:none;padding:20px 0;display:flex;justify-content:space-between;gap:16px;font:400 clamp(17px,1.6vw,21px)/1.3 var(--display)}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"+";font-family:var(--mono);color:var(--muted)}
details.faq[open] summary::after{content:"−"}
details.faq p{padding-bottom:20px;color:var(--muted);max-width:70ch}
.faqwrap{border-top:1px solid var(--ink)}

/* team */
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 20px}
@media (max-width:1000px){.tgrid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){.tgrid{grid-template-columns:1fr 1fr}}
.tcard{display:grid;gap:10px;align-content:start}
.tcard .ava{aspect-ratio:4/5;background:var(--soft);display:grid;place-items:end start;padding:14px;position:relative;overflow:hidden}
.tcard .ava svg{position:absolute;inset:0;width:100%;height:100%}
.tcard .ava .demo{position:relative;background:var(--surface)}
.tcard h4{font-size:17px}
.tcard p{font-size:14px;color:var(--muted)}

/* timeline */
.tl{border-top:1px solid var(--ink)}
.tl div{display:grid;grid-template-columns:140px 1fr;gap:24px;padding-block:20px;border-bottom:1px solid var(--line)}
.tl b{font:300 26px/1 var(--display)}
@media (max-width:600px){.tl div{grid-template-columns:1fr;gap:6px}}

/* article */
.article{max-width:760px}
.article .prose{font-size:18px;line-height:1.7}
.article blockquote{margin:12px 0;padding-left:24px;border-left:2px solid var(--accent);font:300 clamp(22px,2.4vw,30px)/1.3 var(--display);letter-spacing:-.02em}
.share{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.share a,.share button{font-size:13.5px;text-decoration:none;border:1px solid var(--line);padding:7px 12px;background:none;color:var(--ink);cursor:pointer;font-family:var(--body)}

/* vacancies */
.vrow{display:grid;grid-template-columns:1.4fr 1fr 1fr 40px;gap:20px;align-items:center;padding-block:24px;border-bottom:1px solid var(--line);text-decoration:none}
.vrow:hover h3{color:var(--accent)}
.vrow span{color:var(--muted);font-size:15px}
@media (max-width:700px){.vrow{grid-template-columns:1fr 24px}.vrow span{grid-column:1}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.chips button{font:inherit;font-size:14px;background:none;border:1px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:40px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}

/* contacts */
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink)}
.cgrid div{padding:22px 20px 24px 0;border-bottom:1px solid var(--line);display:grid;gap:6px;align-content:start}
.cgrid .v{font-size:19px}
@media (max-width:760px){.cgrid{grid-template-columns:1fr}}
.map{position:relative;aspect-ratio:21/9;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.map>svg{position:absolute;inset:0;width:100%;height:100%}
.map a{position:absolute;left:16px;bottom:16px}
@media (max-width:700px){.map{aspect-ratio:4/3}}
.copy{background:none;border:1px solid var(--line);color:var(--muted);font:12px var(--mono);padding:4px 8px;cursor:pointer;margin-left:8px;vertical-align:middle}

/* notice */
.notice{background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:13px}
.notice .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:8px;flex-wrap:wrap}
.notice button{background:none;border:0;color:var(--ink);cursor:pointer;font:inherit;text-decoration:underline}

/* footer */
footer.site{background:var(--ink);color:var(--ground);padding-block:64px 32px;margin-top:0}
footer.site a{text-decoration:none;opacity:.78}
footer.site a:hover{opacity:1}
.fcols{display:grid;grid-template-columns:1.4fr repeat(5,1fr);gap:28px}
.fcols h5{font-family:var(--mono);font-size:11.5px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;opacity:.55;margin:0 0 14px}
.fcols ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14.5px}
.fbottom{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-top:56px;padding-top:24px;border-top:1px solid color-mix(in srgb,var(--ground) 18%,transparent);font-size:13px;opacity:.7}
footer.site .logo{color:var(--ground)}
footer.site .langs button{color:color-mix(in srgb,var(--ground) 60%,transparent)}
footer.site .langs button[aria-pressed="true"]{color:var(--ground)}
@media (max-width:1000px){.fcols{grid-template-columns:repeat(3,1fr)}.fcols>div:first-child{grid-column:1/-1}}
@media (max-width:560px){.fcols{grid-template-columns:1fr 1fr}}

/* ===== BIM hero ===== */
.top.dark{background:#07142A;border-bottom-color:rgba(160,200,240,.14);color:#EAF2FA}
.top.dark .nav a{color:rgba(234,242,250,.66)}
.top.dark .nav a:hover,.top.dark .nav a[aria-current="page"]{color:#fff;border-color:#6FD3FF}
.top.dark .langs button{color:rgba(234,242,250,.55)}.top.dark .langs button[aria-pressed="true"]{color:#fff}
.top.dark .btn{background:transparent;color:#EAF2FA;box-shadow:inset 0 0 0 1px rgba(111,211,255,.7);border-radius:40px}
.top.dark .btn:hover{background:#6FD3FF;color:#07142A}
.top.dark .burger{color:#EAF2FA}
.logo small{display:block;font:600 13.5px/1 var(--display);letter-spacing:.22em;color:#B8893F;margin-top:8px}
.top.dark .logo small,footer.site .logo small{color:#E3C27E}
.logo .wm{display:flex;flex-direction:column}
.logo svg.mk{width:auto;height:46px}
@media (max-width:420px){.logo small{font-size:11.5px;letter-spacing:.16em}}
.bh{position:relative;background:#07142A;color:#EAF2FA;overflow:hidden;min-height:min(880px,calc(100svh - 72px));display:grid;grid-template-rows:1fr auto;isolation:isolate}
.bh .scene{position:absolute;inset:0;z-index:-2}
.bh .scene svg{width:100%;height:100%;display:block}
.bh::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(6,15,31,.94) 0%,rgba(6,15,31,.7) 34%,rgba(6,15,31,0) 58%),linear-gradient(0deg,rgba(6,15,31,.85) 0%,rgba(6,15,31,0) 30%)}
.bh .in{display:grid;grid-template-columns:48px minmax(0,1fr) minmax(0,300px);gap:clamp(16px,3vw,40px);align-items:center;padding-block:clamp(40px,6vw,72px) 32px}
.bh .dots{display:grid;gap:18px;font:500 12px/1 var(--mono);align-self:center}
.bh .dots button{background:none;border:0;color:rgba(234,242,250,.45);font:inherit;cursor:pointer;padding:6px 0;text-align:left;display:flex;align-items:center;gap:8px}
.bh .dots button[aria-pressed="true"]{color:#fff}
.bh .dots button[aria-pressed="true"]::after{content:"";width:18px;border-top:1px solid #6FD3FF}
.bh .vword{writing-mode:vertical-rl;transform:rotate(180deg);font:500 10.5px/1 var(--mono);letter-spacing:.3em;color:rgba(234,242,250,.4);margin-top:24px}
.bh h1{font:600 clamp(34px,6vw,96px)/.95 var(--display);letter-spacing:-.02em;text-transform:uppercase;color:#fff;text-shadow:0 2px 40px rgba(0,0,0,.35)}
.bh h1 span{display:block;width:max-content;max-width:100%;padding-right:.05em;background:linear-gradient(180deg,#FFFFFF 30%,#A9DDF7);-webkit-background-clip:text;background-clip:text;color:transparent}
.bh .tag{font:500 13px/1 var(--mono);letter-spacing:.32em;text-transform:uppercase;color:#6FD3FF;margin-top:26px}
.bh .desc{font-size:clamp(16px,1.4vw,19px);color:rgba(234,242,250,.8);max-width:36ch;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:14px;margin-top:32px;padding:14px 24px;border-radius:40px;color:#fff;text-decoration:none;font:500 14px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;background:rgba(111,211,255,.08);box-shadow:inset 0 0 0 1px rgba(111,211,255,.75),0 0 24px rgba(111,211,255,.25);transition:background .25s,box-shadow .25s}
.pill:hover{background:rgba(111,211,255,.2);box-shadow:inset 0 0 0 1px #6FD3FF,0 0 36px rgba(111,211,255,.45)}
.disc{list-style:none;margin:0;padding:18px 18px;display:grid;gap:14px;align-self:center;background:linear-gradient(90deg,rgba(6,15,31,.2),rgba(6,15,31,.5));border-left:1px solid rgba(111,211,255,.3)}
.disc b,.disc span{text-shadow:0 1px 8px rgba(3,8,18,.95),0 0 2px rgba(3,8,18,.9)}
.disc li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;position:relative}
.disc li::before{content:"";position:absolute;right:calc(100% + 10px);top:50%;width:clamp(20px,5vw,90px);border-top:1px dashed rgba(111,211,255,.45)}
.disc li::after{content:"";position:absolute;right:calc(100% + 10px + clamp(20px,5vw,90px));top:calc(50% - 3px);width:6px;height:6px;border-radius:50%;background:#6FD3FF;box-shadow:0 0 10px #6FD3FF}
.disc svg{width:30px;height:30px;color:#6FD3FF}
.disc b{display:block;font:600 13px/1.25 var(--body);text-transform:uppercase;letter-spacing:.04em;color:#fff}
.disc span{font-size:12.5px;color:rgba(234,242,250,.62)}
.feat{border-top:1px solid rgba(160,200,240,.18);background:rgba(6,15,31,.55);backdrop-filter:blur(6px)}
.feat .wrap{display:grid;grid-template-columns:repeat(4,1fr) auto;align-items:center}
.feat .f{display:flex;gap:14px;align-items:center;padding:20px 20px 20px 0;font:500 13px/1.3 var(--body);text-transform:uppercase;letter-spacing:.06em}
.feat .f+.f{padding-left:20px;border-left:1px solid rgba(160,200,240,.14)}
.feat svg{width:28px;height:28px;color:#6FD3FF;flex:none}
.feat .motto{font:500 11px/1 var(--mono);letter-spacing:.28em;color:rgba(234,242,250,.5);text-transform:uppercase;padding-left:20px}
.bh .slidetxt{transition:opacity .35s}
@media (max-width:1100px){.bh .in{grid-template-columns:40px minmax(0,1fr)}.disc{display:none}.feat .motto{display:none}.feat .wrap{grid-template-columns:repeat(4,1fr)}}
@media (max-width:760px){.bh h1{font-size:clamp(30px,10vw,48px)}.bh .in{grid-template-columns:minmax(0,1fr)}.bh .dots{grid-auto-flow:column;justify-content:start;gap:16px;order:2}.bh .vword{display:none}.feat .wrap{grid-template-columns:1fr 1fr}.feat .f,.feat .f+.f{padding:14px 10px 14px 0;border-left:0;font-size:11.5px;letter-spacing:.03em}.feat svg{width:24px;height:24px}.bh::before{background:linear-gradient(180deg,rgba(6,15,31,.9) 0%,rgba(6,15,31,.55) 45%,rgba(6,15,31,.2) 70%,rgba(6,15,31,.9) 100%)}}

/* ===== photo hero & home ===== */
.art img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.pcard:hover .art img,.fc:hover .art img,.jcard:hover .art img{transform:scale(1.04)}
.gallery .art{overflow:hidden}
.top.dark{background:linear-gradient(180deg,rgba(5,10,18,.72),rgba(5,10,18,.35));backdrop-filter:blur(6px);border-bottom-color:rgba(255,255,255,.12)}
.top.dark .btn{border-radius:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}
.top.dark .btn:hover{background:#fff;color:#0B1628}

.phh h1{font:600 clamp(40px,6.2vw,92px)/1 var(--display);letter-spacing:-.01em;text-transform:uppercase;margin:18px 0 22px;max-width:12ch;color:#fff}
.phh .txt p{max-width:46ch;font-size:clamp(16px,1.4vw,18.5px);color:rgba(255,255,255,.86)}
.phh .cta{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-top:32px}
.btn.wht{background:#fff;color:#0B1628}.btn.wht:hover{background:var(--accent);color:#fff}

@media (max-width:640px){.sstrip .wrap{grid-template-columns:1fr 1fr}.si,.si+.si{padding:22px 12px 22px 0;border-left:0;border-top:1px solid var(--line);grid-template-columns:1fr}.si:nth-child(-n+2){border-top:0}}
.feat2{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,3fr);gap:clamp(24px,4vw,56px);align-items:start}
.feat2 .fl{display:grid;gap:18px;align-content:start;padding-top:8px}

.feat2 .fr{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.fc{text-decoration:none;display:grid;gap:12px}

  concept:{ru:"Корпуса повторяют линию берега и спускаются к воде мягкими террасами. Между ними течёт длинный бассейн-лагуна, а в центре стоят павильоны-раковины: ресторан, спа и зона событий.",uz:"Korpuslar sohil chizig‘ini takrorlaydi va suvga yumshoq terrasalar bilan tushadi. Ular orasida uzun laguna-basseyn oqadi, markazda esa chig‘anoq-pavilonlar: restoran, spa va tadbirlar zonasi.",en:"The wings follow the shoreline and step down to the water in soft terraces. A long lagoon pool runs between them, and shell-like pavilions at the centre house a restaurant, spa and event space.",zh:"建筑体量顺应河岸线，以柔和的台地逐级向水面跌落。长长的泻湖泳池穿行其间，中央的贝壳形展馆内设有餐厅、水疗中心和活动空间。"},
  sol:{ru:"Зелёные кровли и террасы, панорамное остекление, деревянный променад вдоль реки, причалы для лодок и вечерняя подсветка набережной.",uz:"Yashil tomlar va terrasalar, panoramali oynalar, daryo bo‘ylab yog‘och promenad, qayiqlar uchun pristanlar va sohilning kechki yoritilishi.",en:"Green roofs and terraces, panoramic glazing, a timber promenade along the river, boat moorings and evening lighting along the waterfront.",zh:"绿色屋顶与露台、全景玻璃、沿河木栈道、游艇泊位以及滨水夜景照明。"}},
 {s:"bochka-new-coffee",type:"public",img:"cf19",plan:"cf17",planT:{ru:"План первого этажа",uz:"Birinchi qavat rejasi",en:"Ground floor plan",zh:"首层平面图"},

  sub:{ru:"Кафе и павильоны на набережной",uz:"Sohil bo‘yidagi kafe va pavilonlar",en:"Waterfront café and pavilions",zh:"滨水咖啡馆与展馆"},
  loc:{ru:"Bochka",uz:"Bochka",en:"Bochka",zh:"Bochka"},
  d:{ru:"Два павильона на набережной: кафе-мороженое и ресторан с открытыми террасами и круглым пирсом над водой.",uz:"Sohildagi ikki pavilon: muzqaymoq kafesi va ochiq terrasali hamda suv ustidagi dumaloq pirsli restoran.",en:"Two pavilions on the promenade: a gelato café and a restaurant with open terraces and a round pier over the water.",zh:"滨水步道上的两座展馆：一家意式冰淇淋咖啡馆和一家带开放露台及水上圆形平台的餐厅。"},
  task:{ru:"Оживить набережную вдоль дороги и парковки и дать людям повод остановиться у воды.",uz:"Yo‘l va avtoturargoh bo‘ylab sohilni jonlantirish va odamlarga suv bo‘yida to‘xtash uchun sabab berish.",en:"Bring the promenade beside the road and car park to life and give people a reason to stop by the water.",zh:"激活道路和停车场旁的滨水步道，让人们有理由在水边驻足。"},
  concept:{ru:"Павильоны плавной овальной формы с широкими козырьками и сплошным остеклением. Террасы выходят прямо к воде, круглый пирс работает как летняя площадка.",uz:"Keng soyabonli va to‘liq oynali silliq oval shakldagi pavilonlar. Terrasalar to‘g‘ridan-to‘g‘ri suvga chiqadi, dumaloq pirs yozgi maydon vazifasini bajaradi.",en:"Soft oval pavilions with wide canopies and full-height glazing. The terraces open straight onto the water, and the round pier serves as a summer deck.",zh:"柔和的椭圆形展馆，配有宽大挑檐和落地玻璃。露台直通水面，圆形平台作为夏季露天区域。"},
  sol:{ru:"Велодорожка и прогулочная зона вдоль берега, озеленение откосов, тёплая вечерняя подсветка, открытые террасы на кровле.",uz:"Sohil bo‘ylab velo yo‘lak va sayr zonasi, qiyaliklarni ko‘kalamzorlashtirish, iliq kechki yoritish, tomdagi ochiq terrasalar.",en:"A cycle lane and walkway along the shore, planted slopes, warm evening lighting and open roof terraces.",zh:"沿岸自行车道和步行道、绿化坡地、温暖的夜间照明以及开放的屋顶露台。"}},
 {s:"pushkin",status:"build",type:"res",img:"pu02",web:"https://pushkin-place.uz/",
  facts:{year:{ru:"Сдача — IV квартал 2027",uz:"Topshirish — 2027-yil IV chorak",en:"Completion — Q4 2027",zh:"2027 年第四季度交付"},area:{ru:"73 000 м²",uz:"73 000 m²",en:"73,000 m²",zh:"73,000 m²"},floors:{ru:"2 блока по 16 этажей",uz:"16 qavatli 2 blok",en:"2 blocks × 16 floors",zh:"2 栋 × 16 层"},parking:{ru:"Подземный, 2 уровня",uz:"Yer osti, 2 qavat",en:"Underground, 2 levels",zh:"地下两层"},client:{ru:"Pushkin East · Tower Up",uz:"Pushkin East · Tower Up",en:"Pushkin East · Tower Up",zh:"Pushkin East · Tower Up"}},
  gal:["pu02","pu05","pu01","pu03","pu04","pu06","pu00"],
  svc:["architecture","bim","engineering","visualization"],
  t:{ru:"Pushkin",uz:"Pushkin",en:"Pushkin",zh:"Pushkin"},
  sub:{ru:"Жилой комплекс премиум-класса с фасадом из изогнутых ламелей",uz:"Egilgan lamelli fasadli premium turar-joy majmuasi",en:"Premium residential complex with a curved-fin façade",zh:"曲线鳍片立面的高端住宅综合体"},
  loc:{ru:"Мирзо-Улугбекский район, Ташкент",uz:"Mirzo Ulug‘bek tumani, Toshkent",en:"Mirzo-Ulugbek district, Tashkent",zh:"塔什干米尔佐-乌鲁格别克区"},
  d:{ru:"ЖК Pushkin — жилой комплекс премиум-класса: два 16-этажных блока, 224 квартиры (2-, 3- и 4-комнатные), 4 000 м² коммерческих помещений и двухуровневый подземный паркинг. Фасад окутан вертикальными ламелями, которые плавно изгибаются и сходятся над главным входом. Комплекс строится, сдача — IV квартал 2027 года.",uz:"Pushkin TJM — premium turar-joy majmuasi: ikkita 16 qavatli blok, 224 ta xonadon (2, 3 va 4 xonali), 4 000 m² tijorat maydoni va ikki qavatli yer osti avtoturargohi. Fasad silliq egilib, asosiy kirish ustida tutashadigan vertikal lamellar bilan o‘ralgan. Majmua qurilmoqda, topshirish — 2027-yil IV chorak.",en:"Pushkin is a premium residential complex: two 16-storey blocks, 224 apartments (2, 3 and 4 rooms), 4,000 m² of commercial space and a two-level underground car park. The façade is wrapped in vertical fins that curve gently and meet above the main entrance. Under construction, completion in Q4 2027.",zh:"Pushkin 是一座高端住宅综合体：两栋 16 层楼，共 224 套住宅（两居、三居和四居），4,000 平方米商业空间及两层地下停车场。立面由竖向鳍片包裹，鳍片柔和弯曲并在主入口上方交汇。项目在建，预计 2027 年第四季度交付。"},
  task:{ru:"Создать новую высотную доминанту района рядом с железной дорогой и магистралью, узнаваемую с любой точки города.",uz:"Temir yo‘l va magistral yonida tumanning shaharning istalgan nuqtasidan taniladigan yangi baland dominantasini yaratish.",en:"Create a new high-rise landmark for the district beside the railway and a main road, recognisable from anywhere in the city.",zh:"在铁路和城市干道旁打造新的区域高层地标，从城市任何角落都能辨认。"},
  concept:{ru:"Ламели ведут взгляд снизу вверх и раскрываются короной на кровле. Над входом они расходятся аркой, открывая остеклённое лобби с тёплым светом.",uz:"Lamellar nigohni pastdan yuqoriga yo‘naltiradi va tomda toj kabi ochiladi. Kirish ustida ular ark shaklida ajralib, iliq yorug‘likli shishali lobbini ochadi.",en:"The fins draw the eye upward and open into a crown at the top. Above the entrance they part in an arch, revealing a glazed lobby in warm light.",zh:"鳍片引导视线向上，并在顶部展开成冠。入口上方鳍片分开形成拱门，露出暖光中的玻璃大堂。"},
  sol:{ru:"Ламели работают как солнцезащита и вечером подсвечиваются. У подножия — благоустроенный сквер с водоёмом, мостиком и площадью перед входом.",uz:"Lamellar quyoshdan himoya vazifasini bajaradi va kechqurun yoritiladi. Poyida — suv havzasi, ko‘prikcha va kirish oldidagi maydonli obodonlashtirilgan xiyobon.",en:"The fins act as sun shading and are lit at night. At the base, a landscaped garden with a pond, footbridge and entrance plaza.",zh:"鳍片兼作遮阳构件，夜间亮起。建筑底部是带水池、小桥和入口广场的景观花园。"}},

  loc:{ru:"Ташкент",uz:"Toshkent",en:"Tashkent",zh:"塔什干"},
  d:{ru:"24-этажное здание с современным силуэтом и полностью стеклянным фасадом. Углы объёма выполнены в мягких округлых формах, что придаёт архитектуре премиальный и плавный облик.",uz:"Zamonaviy siluetli va to‘liq shisha fasadli 24 qavatli bino. Hajm burchaklari yumshoq dumaloq shakllarda bajarilgan, bu arxitekturaga premium va silliq qiyofa beradi.",en:"A 24-storey building with a contemporary silhouette and a fully glazed façade. Rounded corners give the architecture a smooth, premium look.",zh:"一座 24 层建筑，拥有现代轮廓和全玻璃立面。圆润的转角使建筑显得流畅而高端。"},
  task:{ru:"Сделать высотное здание визуально лёгким и «живым», с удобным прямым подъездом автомобилей к главному входу.",uz:"Baland binoni vizual yengil va «jonli» qilish, asosiy kirishga avtomobillar uchun qulay to‘g‘ridan-to‘g‘ri kirishni ta’minlash.",en:"Make a tall building feel light and alive, with a direct, convenient drive-up to the main entrance.",zh:"让高层建筑显得轻盈而富有生气，并提供直达主入口的便捷车行通道。"},
  concept:{ru:"Объём поднимается не строго вертикально: на уровнях с террасами форма слегка смещается, создавая динамику и выразительный ритм.",uz:"Hajm qat’iy vertikal ko‘tarilmaydi: terrasali sathlarda shakl biroz siljiydi va dinamika hamda ifodali ritm yaratadi.",en:"The volume does not rise strictly vertically: at the terrace levels the form shifts slightly, creating movement and a strong rhythm.",zh:"体量并非严格垂直上升：在露台层，形体略微错动，形成动感和鲜明的节奏。"},
  sol:{ru:"Террасы с деревьями и зелёными зонами на 1–5, 13, 17, 19 и 24 этажах. Стеклянный фасад гармонично сочетается с акцентами зелёных террас.",uz:"1–5, 13, 17, 19 va 24-qavatlarda daraxtlar va yashil zonali terrasalar. Shisha fasad yashil terrasalar urg‘ulari bilan uyg‘un uyg‘unlashadi.",en:"Terraces with trees and planting on floors 1–5, 13, 17, 19 and 24. The glass façade pairs with the green terraces as accents.",zh:"1–5 层及 13、17、19、24 层设有种植树木和绿化的露台。玻璃立面与绿色露台相互映衬。"}},
 {s:"airport-mall",type:"master",img:"am-main",

  sub:{ru:"Жильё, торговля, офисы и отель в одном комплексе",uz:"Uy-joy, savdo, ofislar va mehmonxona bitta majmuada",en:"Homes, retail, offices and a hotel in one complex",zh:"住宅、商业、办公和酒店一体的综合体"},
  loc:{ru:"Ташкент",uz:"Toshkent",en:"Tashkent",zh:"塔什干"},
  d:{ru:"Современный многофункциональный комплекс, где жилая среда, коммерция и деловая активность объединены в продуманную архитектурную систему.",uz:"Turar-joy muhiti, savdo va ishbilarmonlik faolligi puxta o‘ylangan arxitektura tizimiga birlashtirilgan zamonaviy ko‘p funksiyali majmua.",en:"A contemporary mixed-use complex where homes, retail and business are combined into one well-considered architectural system.",zh:"一座现代综合体，将住宅、商业和办公融为一个经过周密考虑的建筑系统。"},
  task:{ru:"Создать цельную среду, где проживание, работа, отдых и сервис объединены в одном пространстве и делают повседневную жизнь проще и удобнее.",uz:"Yashash, ishlash, dam olish va xizmat ko‘rsatish bitta makonda birlashgan, kundalik hayotni osonroq va qulayroq qiladigan yaxlit muhit yaratish.",en:"Create a coherent environment where living, working, leisure and services share one place and make everyday life simpler.",zh:"打造一个协调统一的环境，让居住、工作、休闲和服务集中于一处，使日常生活更加便利。"},
  concept:{ru:"Жилые башни в спокойной геометрии стоят на общем стилобате. На первом уровне — маркет и коммерческие помещения, рядом офисная зона и компактный отель в едином стиле. Верхний уровень отдан жителям: двор и детская площадка, защищённые от городской суеты.",uz:"Sokin geometriyadagi turar-joy minoralari umumiy stilobatda joylashgan. Birinchi sathda — market va tijorat binolari, yonida ofis zonasi va yagona uslubdagi ixcham mehmonxona. Yuqori sath aholiga berilgan: shahar shovqinidan himoyalangan hovli va bolalar maydonchasi.",en:"Residential towers with calm geometry rise from a shared podium. The ground level holds a market and shops, alongside an office zone and a compact hotel in the same style. The upper level belongs to residents, with a courtyard and playground sheltered from the city.",zh:"几何形态沉稳的住宅塔楼坐落在共享裙楼之上。首层为超市和商铺，旁边是办公区和风格统一的精品酒店。上层归住户所有，庭院和儿童游乐场远离城市喧嚣。"},
  sol:{ru:"Жилые здания — 58 895 м², коммерческая зона — 50 163 м², отель — 18 520 м², офисы — 5 550 м², парковка — 26 000 м². Озеленение улицы — 6 612 м², зелёная кровля — 2 150 м². Парковка разгружает двор и делает внутренние маршруты безопасными.",uz:"Turar-joy binolari — 58 895 m², tijorat zonasi — 50 163 m², mehmonxona — 18 520 m², ofislar — 5 550 m², avtoturargoh — 26 000 m². Ko‘cha ko‘kalamzorlashtirish — 6 612 m², yashil tom — 2 150 m². Avtoturargoh hovlini bo‘shatadi va ichki yo‘laklarni xavfsiz qiladi.",en:"Housing 58,895 m², retail 50,163 m², hotel 18,520 m², offices 5,550 m², parking 26,000 m². Street landscaping 6,612 m² and a 2,150 m² green roof. Parking keeps cars out of the courtyard and makes internal routes safe.",zh:"住宅 58,895 m²，商业 50,163 m²，酒店 18,520 m²，办公 5,550 m²，停车 26,000 m²。街道绿化 6,612 m²，绿色屋顶 2,150 m²。停车设施使庭院免受车辆干扰，内部动线安全。"}},

  loc:{ru:"Ташкент",uz:"Toshkent",en:"Tashkent",zh:"塔什干"},
  d:{ru:"Штаб-квартира компании из двух объёмов: офисная башня с вертикальными ламелями и лёгкий стеклянный павильон с выразительным порталом входа, объединённые озеленённой площадью.",uz:"Kompaniya shtab-kvartirasi ikki hajmdan iborat: vertikal lamelli ofis minorasi va kirish portali ifodali bo‘lgan yengil shisha pavilon, ular ko‘kalamzorlashtirilgan maydon bilan birlashtirilgan.",en:"A company headquarters in two volumes: an office tower with vertical fins and a light glass pavilion with a bold entrance portal, joined by a landscaped plaza.",zh:"由两个体量组成的公司总部：带竖向鳍片的办公塔楼和带醒目入口门廊的轻盈玻璃展馆，由景观广场相连。"},
  task:{ru:"Создать узнаваемый образ компании на городском перекрёстке: офисы, клиентская зона и витрины в одном ансамбле.",uz:"Shahar chorrahasida kompaniyaning taniqli qiyofasini yaratish: ofislar, mijozlar zonasi va vitrinalar bitta ansamblda.",en:"Give the company a recognisable presence on a city corner, with offices, a client area and shopfronts in one ensemble.",zh:"让公司在城市街角拥有辨识度，把办公、客户区和临街商铺组合成一个整体。"},
  concept:{ru:"Строгая башня и мягкий по форме павильон дополняют друг друга. Портал павильона со светящимся контуром становится знаком компании и главным входом.",uz:"Qat’iy minora va yumshoq shakldagi pavilon bir-birini to‘ldiradi. Yorug‘ konturli pavilon portali kompaniya belgisi va asosiy kirishga aylanadi.",en:"The strict tower and the softly shaped pavilion complement each other. The pavilion’s illuminated portal becomes the company’s sign and main entrance.",zh:"严谨的塔楼与形态柔和的展馆相得益彰。展馆的发光门廊成为公司的标志和主入口。"},
  sol:{ru:"Вертикальные ламели на фасаде башни, витрины первого этажа в тёплых порталах, терраса с зеленью на кровле, стеклянные своды павильона и озеленённая площадь с парковкой.",uz:"Minora fasadidagi vertikal lamellar, iliq portallardagi birinchi qavat vitrinalari, tomdagi yashil terrasa, pavilonning shisha gumbazlari va avtoturargohli ko‘kalamzor maydon.",en:"Vertical fins on the tower façade, ground-floor shopfronts in warm portals, a planted roof terrace, the pavilion’s curved glass bays and a landscaped plaza with parking.",zh:"塔楼立面竖向鳍片、首层暖色门廊中的临街商铺、绿化屋顶露台、展馆的弧形玻璃以及带停车场的景观广场。"}},

  loc:{ru:"Ташкент",uz:"Toshkent",en:"Tashkent",zh:"塔什干"},
  d:{ru:"Современное здание с выразительным чистым объёмом, прозрачными фасадами и вертикальной геометрией, которые отражают динамику города и создают ощущение лёгкости.",uz:"Ifodali toza hajm, shaffof fasadlar va vertikal geometriyaga ega zamonaviy bino: ular shahar dinamikasini aks ettiradi va yengillik hissini beradi.",en:"A contemporary building with a clean, expressive volume, transparent façades and vertical geometry that reflect the city’s energy and create a sense of lightness.",zh:"一座体量简洁而富有表现力的现代建筑，通透的立面和竖向几何形态体现城市活力，营造轻盈之感。"},
  task:{ru:"Создать бизнес-центр, где технологичность, природные элементы и деловые функции объединены в единую архитектурную форму.",uz:"Texnologiyalar, tabiiy elementlar va biznes funksiyalari yagona arxitektura shaklida birlashgan biznes-markaz yaratish.",en:"Create a business centre where technology, natural elements and business functions come together in a single architectural form.",zh:"打造一个将科技、自然元素与商务功能融为一体的商务中心。"},
  concept:{ru:"Центральная часть здания организована вокруг внутренней зелёной зоны. Открытый атриум привносит природный акцент, формирует спокойную атмосферу и связывает уровни визуально.",uz:"Binoning markaziy qismi ichki yashil zona atrofida tashkil etilgan. Ochiq atrium tabiiy urg‘u beradi, sokin muhit yaratadi va sathlarni vizual bog‘laydi.",en:"The heart of the building is organised around an inner green zone. The open atrium brings nature inside, sets a calm atmosphere and links the levels visually.",zh:"建筑核心围绕内部绿化区组织。开放中庭将自然引入室内，营造宁静氛围，并在视觉上连接各层。"},
  sol:{ru:"Первый этаж — просторное открытое лобби с плавным переходом в эксклюзивный шоурум. На этажах — просторные офисы, гибкая планировка и панорамные фасады. Подземный паркинг на 280 машиномест.",uz:"Birinchi qavat — eksklyuziv shourumga silliq o‘tuvchi keng ochiq lobbi. Qavatlarda keng ofislar, moslashuvchan reja va panoramali fasadlar. 280 o‘rinli yer osti avtoturargohi.",en:"The ground floor is a spacious open lobby flowing into an exclusive showroom. Upper floors offer generous offices, flexible layouts and panoramic façades, with 280 underground parking spaces.",zh:"首层是宽敞开放的大堂，与专属展厅相连。上层提供宽敞的办公空间、灵活的布局和全景立面，另有 280 个地下停车位。"}},

  sub:{ru:"Винодельня, отель, ресторан и спа в Паркенте",uz:"Parkentdagi vinochilik, mehmonxona, restoran va spa",en:"Winery, hotel, restaurant and spa in Parkent",zh:"帕尔肯特的酒庄、酒店、餐厅与水疗中心"},
  loc:{ru:"Паркент, Ташкентская область",uz:"Parkent, Toshkent viloyati",en:"Parkent, Tashkent Region",zh:"塔什干州帕尔肯特"},
  d:{ru:"Комплекс, в котором современная архитектура аккуратно встроена в природный рельеф. Винодельня, ресторан, отель, амбар, кампус и спа-бассейн объединены в единый маршрут.",uz:"Zamonaviy arxitektura tabiiy relyefga ehtiyotkorlik bilan joylashtirilgan majmua. Vinochilik, restoran, mehmonxona, ombor, kampus va spa-basseyn yagona yo‘nalishga birlashtirilgan.",en:"A complex where contemporary architecture is set carefully into the natural terrain. A winery, restaurant, hotel, barn, campus and spa pool are joined into a single route.",zh:"现代建筑与自然地形巧妙融合的综合体。酒庄、餐厅、酒店、谷仓、园区和水疗泳池串联成一条完整的游线。"},
  task:{ru:"Объединить винодельню, ресторан, отель, амбар, кампус и спа на участке 130 га так, чтобы формы и материалы работали как одна система и не спорили с природой.",uz:"130 ga maydonda vinochilik, restoran, mehmonxona, ombor, kampus va spani shakl va materiallar yagona tizim sifatida ishlaydigan va tabiat bilan ziddiyatga kirmaydigan qilib birlashtirish.",en:"Bring a winery, restaurant, hotel, barn, campus and spa together on a 130-hectare site so that forms and materials work as one system and sit quietly in the landscape.",zh:"在 130 公顷的用地上整合酒庄、餐厅、酒店、谷仓、园区和水疗中心，使形态与材料构成统一的系统，并与自然景观和谐共处。"},
  concept:{ru:"Главный акцент — винодельня с длинной волнообразной галереей на ряде колонн. Стеклянные фасады открывают виды на виноградники, а вечерняя подсветка превращает здание в мягкую линию света. Ресторан на нижнем уровне галереи выходит на террасы.",uz:"Asosiy urg‘u — ustunlar qatoriga tayangan uzun to‘lqinsimon galereyali vinochilik. Shisha fasadlar uzumzorlarga manzara ochadi, kechki yoritish esa binoni yumshoq yorug‘lik chizig‘iga aylantiradi. Restoran galereyaning pastki sathida joylashgan va terrasalarga chiqadi.",en:"The centrepiece is the winery, with a long wave-shaped gallery raised on a row of columns. Glass façades open onto the vineyards, and evening lighting turns the building into a soft line of light. The restaurant sits on the gallery’s lower level and opens onto terraces.",zh:"核心是酒庄：一条长长的波浪形长廊架设在一排立柱上。玻璃立面朝向葡萄园，夜间照明使建筑化作一道柔和的光带。餐厅位于长廊下层，通向露台。"},
  sol:{ru:"Отель построен на уклоне и раскрывается длинными горизонталями и стеклом: с каждого уровня видны горы и виноградники. Амбар выполнен в современной сельской эстетике, кампус — светлая минималистичная рабочая среда, спа-бассейн с плавными линиями завершает маршрут.",uz:"Mehmonxona qiyalikda qurilgan va uzun gorizontallar hamda shisha bilan ochiladi: har bir sathdan tog‘lar va uzumzorlar ko‘rinadi. Ombor zamonaviy qishloq estetikasida, kampus — yorug‘ minimalistik ish muhiti, silliq chiziqli spa-basseyn yo‘nalishni yakunlaydi.",en:"The hotel steps down the slope in long horizontals and glass, with mountain and vineyard views from every level. The barn has a modern rural character, the campus is a bright, minimal workplace, and a softly curved spa pool ends the route.",zh:"酒店沿坡地以长长的水平线和玻璃逐级跌落，每一层都能看到山景和葡萄园。谷仓具有现代乡村气质，园区是明亮简约的办公空间，曲线柔和的水疗泳池为游线收尾。"}},

  task:{ru:"Объединить на одном участке у воды жильё, офисы, торговлю и отдых так, чтобы набережная и зелень остались открытыми для людей.",uz:"Suv bo‘yidagi bitta uchastkada uy-joy, ofislar, savdo va dam olishni birlashtirish, sohil va yashil hududlar odamlar uchun ochiq qolishi kerak.",en:"Bring housing, offices, retail and leisure together on one waterfront site while keeping the shore and greenery open to the public.",zh:"在同一块滨水用地上整合住宅、办公、商业和休闲，同时让岸线和绿地对公众开放。"},
  concept:{ru:"Главное здание раскрывается к морю террасами-волнами. Кровля превращена в общественный парк с прогулочными дорожками, водой и видовыми площадками.",uz:"Asosiy bino dengizga to‘lqinsimon terrasalar bilan ochiladi. Tom sayr yo‘laklari, suv va manzara maydonchalari bo‘lgan jamoat bog‘iga aylantirilgan.",en:"The main building opens to the sea in wave-like terraces. Its roof becomes a public park with walking paths, water and viewpoints.",zh:"主体建筑以波浪般的露台朝向大海展开。屋顶成为带有步道、水景和观景台的公共公园。"},
  sol:{ru:"Параметрический перфорированный фасад, озеленённые террасы, бассейны на кровлях, пешеходный мост между корпусами и набережная с причалом.",uz:"Parametrik perforatsiyalangan fasad, ko‘kalamzorlashtirilgan terrasalar, tomlardagi basseynlar, korpuslar orasidagi piyodalar ko‘prigi va pristanli sohil.",en:"A parametric perforated façade, planted terraces, rooftop pools, a pedestrian bridge between buildings and a promenade with a pier.",zh:"参数化穿孔立面、绿化露台、屋顶泳池、楼宇间的人行天桥以及带码头的滨水步道。"}},

  d:{ru:"Гузар махалли в Кибрае — центр для старшего поколения: здание построено и сдано. Фасады облицованы светлым камнем, ритм стрельчатых окон с резными решётками, главный вход — высокий портал с орнаментальной решёткой.",uz:"Qibraydagi mahalla guzari — keksa avlod uchun markaz: bino qurib topshirilgan. Jabhalar och rangli tosh bilan qoplangan, o‘ymakor panjarali ravoqli derazalar, bosh kirish — naqshinkor panjarali baland peshtoq.",en:"A mahalla guzar in Qibray — a centre for senior citizens, built and handed over. Light stone façades, a rhythm of pointed-arch windows with carved screens, and a tall entrance portal with an ornamental lattice.",zh:"位于基布赖的社区中心——长者之家，已建成并交付。浅色石材立面，带雕花格栅的尖拱窗形成节奏，主入口为饰有图案格栅的高大门廊。"}},

  t:{ru:"Панджара: как ташкентский модернизм защищал здания от солнца",uz:"Panjara: Toshkent modernizmi binolarni quyoshdan qanday himoya qilgan",en:"Panjara: how Tashkent modernism shaded its buildings",zh:"Panjara：塔什干现代主义如何为建筑遮阳"},
  x:{ru:"Бетонные решётки 1960–80-х были инженерным ответом на климат. Разбираем, что из этого работает сегодня.",uz:"1960–80-yillardagi beton panjaralar iqlimga muhandislik javobi edi. Bugun ulardan nimasi ishlashini ko‘rib chiqamiz.",en:"The concrete screens of the 1960s–80s were an engineering answer to the climate. What still works today.",zh:"20 世纪 60–80 年代的混凝土遮阳格栅是应对气候的工程方案。哪些做法至今仍然有效。"},
  b:{ru:["После землетрясения 1966 года Ташкент отстраивался быстро, и архитекторам пришлось решать задачу охлаждения без кондиционеров. Ответом стали солнцезащитные решётки из сборного бетона — панджара, унаследовавшая орнаментальную логику деревянных решёток старого города.","Решётка отбрасывает тень на стекло, но пропускает ветер и рассеянный свет. Сегодня тот же принцип можно рассчитать точно: подобрать глубину и шаг элементов под ориентацию фасада и угол солнца в июле.","Мы используем панджару не как декор, а как часть инженерной системы здания: она снижает пиковую нагрузку на охлаждение и позволяет уменьшить мощность оборудования."],uz:["1966-yilgi zilziladan keyin Toshkent tez qayta qurildi va arxitektorlar konditsionerlarsiz sovutish masalasini hal qilishga majbur bo‘ldi. Javob yig‘ma betondan quyoshdan himoya panjaralari bo‘ldi.","Panjara oynaga soya tashlaydi, lekin shamol va tarqoq yorug‘likni o‘tkazadi. Bugun bu tamoyilni aniq hisoblash mumkin.","Biz panjarani bezak sifatida emas, balki binoning muhandislik tizimining bir qismi sifatida ishlatamiz."],en:["After the 1966 earthquake Tashkent was rebuilt fast, and architects had to cool buildings without air conditioning. The answer was precast concrete sun screens, panjara, which carried over the ornamental logic of the old city’s timber lattices.","A screen shades the glass but lets through wind and diffuse light. Today the same principle can be calculated precisely, tuning depth and spacing to orientation and the July sun angle.","We use panjara as part of the building’s engineering, not as decoration: it cuts peak cooling load and lets us specify smaller plant."],zh:["1966 年地震后，塔什干迅速重建，建筑师必须在没有空调的情况下为建筑降温。答案是预制混凝土遮阳格栅 panjara，它延续了老城木格栅的装饰逻辑。","格栅为玻璃遮阳，同时让风和漫射光通过。如今同样的原理可以精确计算，根据朝向和七月太阳高度角调整进深与间距。","我们把 panjara 作为建筑工程的一部分，而非装饰：它降低峰值制冷负荷，使设备选型更小。"]}},
 {s:"bim-for-clients",test:true,img:"model",k:"plan",seed:97,date:"2026-08-14",min:5,cat:{ru:"Технологии",uz:"Texnologiyalar",en:"Technology",zh:"技术"},
  t:{ru:"Зачем заказчику BIM, если он не архитектор",uz:"Arxitektor bo‘lmagan buyurtmachiga BIM nima uchun kerak",en:"Why BIM matters to clients who aren’t architects",zh:"为什么 BIM 对非建筑师客户同样重要"},
  x:{ru:"Информационная модель экономит деньги на стройке. Объясняем, где именно.",uz:"Axborot modeli qurilishda pulni tejaydi. Aynan qayerda ekanini tushuntiramiz.",en:"An information model saves money on site. Here’s where.",zh:"信息模型能在施工现场节省成本。具体体现在哪里。"},
  b:{ru:["Большая часть переделок на стройке возникает из-за нестыковок между разделами проекта: воздуховод проходит через балку, трасса канализации упирается в колонну.","В BIM-модели такие коллизии находятся до выхода на площадку. Заказчик получает меньше дополнительных соглашений и более точную смету.","Кроме того, модель остаётся у заказчика после стройки и помогает в эксплуатации здания."],uz:["Qurilishdagi qayta ishlashlarning katta qismi loyiha bo‘limlari o‘rtasidagi nomuvofiqliklar tufayli yuzaga keladi.","BIM-modelda bunday kolliziyalar maydonga chiqishdan oldin topiladi.","Bundan tashqari, model qurilishdan keyin buyurtmachida qoladi va binodan foydalanishda yordam beradi."],en:["Most rework on site comes from clashes between disciplines: a duct runs through a beam, a drain hits a column.","In a BIM model those clashes are found before anyone is on site. The client gets fewer variations and a tighter estimate.","The model also stays with the client after construction and helps run the building."],zh:["现场大部分返工源于专业之间的碰撞：风管穿过梁，排水管撞上柱子。","在 BIM 模型中，这些碰撞在任何人进场之前就会被发现。客户面对更少的变更和更准确的预算。","施工完成后，模型仍留给客户，帮助建筑的运营管理。"]}}

function heroScene(){
  var r=rng(2026),W=1600,H=900,HZ=575,o=[];

   '<linearGradient id="hsk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050E20"/><stop offset=".38" stop-color="#12305A"/><stop offset=".56" stop-color="#4E6A8E"/><stop offset=".64" stop-color="#E7A46A"/><stop offset=".64" stop-color="#2A4466"/><stop offset="1" stop-color="#050C1A"/></linearGradient>'+

   '<linearGradient id="hgl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3453"/><stop offset="1" stop-color="#0B182B"/></linearGradient>'+
   '<linearGradient id="hfin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8FA3B8"/><stop offset=".45" stop-color="#F4F7FA"/><stop offset="1" stop-color="#B9C7D6"/></linearGradient>'+
   '<filter id="hblur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>'+
   '<clipPath id="hsolid"><rect x="0" y="0" width="1110" height="'+H+'"/></clipPath>'+
   '<clipPath id="hwire"><rect x="1085" y="0" width="'+(W-1085)+'" height="'+H+'"/></clipPath>'+
  '</defs>');
  o.push('<rect width="'+W+'" height="'+H+'" fill="url(#hsk)"/><rect width="'+W+'" height="'+H+'" fill="url(#hsun)"/>');

  for(var s=0;s<70;s++){o.push('<circle cx="'+(r()*W).toFixed(0)+'" cy="'+(r()*260).toFixed(0)+'" r="'+(r()*1.1+.3).toFixed(2)+'" fill="#fff" opacity="'+(r()*.5+.2).toFixed(2)+'"/>');}
  // skylines
  function sky(yb,hmin,hmax,col,win,op){var x=-10;while(x<W){var w=18+r()*46,h=hmin+r()*(hmax-hmin);
    if(x>800&&x<1400&&yb===HZ) h*=.55;
    o.push('<rect x="'+x.toFixed(0)+'" y="'+(yb-h).toFixed(0)+'" width="'+w.toFixed(0)+'" height="'+h.toFixed(0)+'" fill="'+col+'" opacity="'+op+'"/>');
    o.push('<rect x="'+x.toFixed(0)+'" y="'+yb+'" width="'+w.toFixed(0)+'" height="'+(h*.5).toFixed(0)+'" fill="'+col+'" opacity="'+(op*.28).toFixed(2)+'"/>');
    if(win){for(var wy=yb-h+8;wy<yb-6;wy+=9){for(var wx=x+4;wx<x+w-4;wx+=7){if(r()<.22)o.push('<rect x="'+wx.toFixed(0)+'" y="'+wy.toFixed(0)+'" width="2.5" height="3" fill="#FFD7A0" opacity="'+(r()*.6+.3).toFixed(2)+'"/>');}}}
    x+=w+2+r()*10;}}
  sky(HZ,40,170,"#3C5577",false,.75);
  sky(HZ,60,330,"#162B47",true,.95);
  // water shimmer
  for(var k=0;k<90;k++){var wx2=r()*W,wy2=HZ+6+r()*300;o.push('<rect x="'+wx2.toFixed(0)+'" y="'+wy2.toFixed(0)+'" width="'+(10+r()*60).toFixed(0)+'" height="1.4" fill="'+(wx2>1000?"#FFBE84":"#8FB8E0")+'" opacity="'+(r()*.35+.1).toFixed(2)+'"/>');}
  // tower geometry
  var X0=860,X1=1360,TOP=110,BASE=740,N=12,fh=(BASE-TOP)/N;
  function finPath(x,amp,ph){var d="M"+x+" "+BASE;for(var i=1;i<=24;i++){var y=BASE-(BASE-TOP)*i/24;var xx=x+Math.sin(i/24*Math.PI*1.6+ph)*amp+(i/24)*40;d+=" L"+xx.toFixed(1)+" "+y.toFixed(1);}return d;}
  // SOLID part
  o.push('<g clip-path="url(#hsolid)">');
  o.push('<rect x="'+X0+'" y="'+TOP+'" width="'+(X1-X0)+'" height="'+(BASE-TOP)+'" fill="url(#hgl)"/>');
  for(var f=0;f<N;f++){var fy=TOP+f*fh;
    for(var cx=X0+6;cx<X1-6;cx+=22){o.push('<rect x="'+cx+'" y="'+(fy+10).toFixed(1)+'" width="18" height="'+(fh-16).toFixed(1)+'" fill="#FFC47E" opacity="'+(r()*.55+.25).toFixed(2)+'"/>');}
    o.push('<rect x="'+(X0-6)+'" y="'+(fy+fh-6).toFixed(1)+'" width="'+(X1-X0+12)+'" height="6" fill="#D9E3EE" opacity=".85"/>');
    for(var g=0;g<5;g++){o.push('<circle cx="'+(X0+r()*(X1-X0)).toFixed(0)+'" cy="'+(fy+fh-10).toFixed(1)+'" r="'+(4+r()*6).toFixed(1)+'" fill="#2F6A45"/>');}
  }
  [880,950,1020,1090].forEach(function(x,i){var d=finPath(x,34,i*.5);o.push('<path d="'+d+'" stroke="#0A1424" stroke-width="30" fill="none" opacity=".45"/><path d="'+d+'" stroke="url(#hfin)" stroke-width="22" fill="none" stroke-linecap="round"/>');});
  o.push('</g>');
  // WIRE part
  o.push('<g clip-path="url(#hwire)">');
  o.push('<rect x="'+X0+'" y="'+TOP+'" width="'+(X1-X0)+'" height="'+(BASE-TOP)+'" fill="#0B2544" opacity=".55"/>');
  var wire=[];
  for(var f2=0;f2<=N;f2++){var yy=TOP+f2*fh;wire.push('<line x1="'+X0+'" y1="'+yy.toFixed(1)+'" x2="'+X1+'" y2="'+yy.toFixed(1)+'"/>');}
  for(var cx2=X0;cx2<=X1;cx2+=44){wire.push('<line x1="'+cx2+'" y1="'+TOP+'" x2="'+cx2+'" y2="'+BASE+'"/>');}
  [1150,1220,1290,1360].forEach(function(x,i){wire.push('<path d="'+finPath(x-40,34,(i+4)*.5)+'"/>');});
  var wg='<g stroke="#6FD3FF" fill="none" stroke-width="1.3">'+wire.join("")+'</g>';
  o.push('<g filter="url(#hblur)" opacity=".7">'+wg+'</g>'+wg);
  var cols=["#FF4D6D","#3DDC84","#FFD23F","#C77DFF","#4DA3FF","#FF8A3D"];
  for(var m=0;m<26;m++){var c=cols[m%cols.length],fl=Math.floor(r()*N),yy2=TOP+fl*fh+fh*(.35+r()*.4),xs=1100+r()*200,len=60+r()*180;
    var d2="M"+xs.toFixed(0)+" "+yy2.toFixed(0)+" H"+Math.min(X1-8,xs+len).toFixed(0);if(r()<.5)d2+=" V"+(yy2+(r()<.5?-1:1)*fh*(1+Math.floor(r()*3))).toFixed(0);
    o.push('<path d="'+d2+'" stroke="'+c+'" stroke-width="3" fill="none" opacity=".9"/><path d="'+d2+'" stroke="'+c+'" stroke-width="8" fill="none" opacity=".25" filter="url(#hblur)"/>');}
  for(var b=0;b<8;b++){var bx=1120+r()*200,by=TOP+Math.floor(r()*N)*fh+8;o.push('<rect x="'+bx.toFixed(0)+'" y="'+by.toFixed(0)+'" width="'+(20+r()*40).toFixed(0)+'" height="'+(fh-20).toFixed(0)+'" fill="none" stroke="'+cols[(b+2)%cols.length]+'" stroke-width="2" opacity=".85"/>');}
  o.push('</g>');
  // seam glow
  o.push('<line x1="1098" y1="'+(TOP-20)+'" x2="1098" y2="'+(BASE+10)+'" stroke="#6FD3FF" stroke-width="2" opacity=".6"/><line x1="1098" y1="'+(TOP-20)+'" x2="1098" y2="'+(BASE+10)+'" stroke="#6FD3FF" stroke-width="10" opacity=".25" filter="url(#hblur)"/>');
  // podium + trees
  o.push('<rect x="780" y="'+BASE+'" width="680" height="30" fill="#0E1D33"/><rect x="780" y="'+BASE+'" width="680" height="3" fill="#6FD3FF" opacity=".5"/>');
  for(var t=0;t<16;t++){var tx=740+r()*720,tr=10+r()*18;o.push('<circle cx="'+tx.toFixed(0)+'" cy="'+(BASE-tr+8).toFixed(0)+'" r="'+tr.toFixed(0)+'" fill="#12301F"/>');}
  // reflection of tower
  o.push('<rect x="'+X0+'" y="'+(BASE+30)+'" width="'+(X1-X0)+'" height="130" fill="#FFC47E" opacity=".07"/>');
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid slice">'+o.join("")+'</svg>';
}

  io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.remove("pre");io.unobserve(e.target);}});},{rootMargin:"0px 0px -8% 0px"});
  var vh=window.innerHeight;
  app.querySelectorAll(".rv").forEach(function(el){var b=el.getBoundingClientRect();if(b.top>vh){el.classList.add("pre");io.observe(el);}});
}

/* ============ events ============ */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-lang],[data-act],[data-lb],[data-dep],[data-track],[data-slide],[data-ph],[data-cert],[data-tc],[data-bx],[data-video]");if(!t) return;
  if(t.hasAttribute("data-bx")){bxI=+t.dataset.bx;bxV=50;document.getElementById("bxwrap").innerHTML=bxStage();app.querySelectorAll("[data-bx]").forEach(function(b){b.setAttribute("aria-pressed",String(+b.dataset.bx===bxI));});return;}
  if(t.hasAttribute("data-cert")){openCert(+t.dataset.cert);return;}
  if(t.hasAttribute("data-video")){openVideo(+t.dataset.video);return;}
  if(t.hasAttribute("data-tc")){var ab=t.dataset.tc.split("-"),pm=TEAM[+ab[0]];openCertObj({who:T(pm.n),caps:pm.c.map(function(x){return x.t;}),pages:pm.c.map(function(x){return x.img;})},+ab[1]);return;}
  if(t.dataset.act==="cert-close"){var o=document.querySelector(".lb");if(o)o.remove();document.body.style.overflow="";return;}
  if(t.dataset.act==="cert-next"){window.__certNext();return;}
  if(t.hasAttribute("data-ph")){phI=(phI+(+t.dataset.ph)+PH.length)%PH.length;app.querySelectorAll(".phh .slides img").forEach(function(im,i){im.classList.toggle("on",i===phI);});var tx=document.getElementById("phtxt");tx.style.opacity="0";setTimeout(function(){tx.innerHTML=phText();document.getElementById("pheye").textContent=T(PH[phI].e);tx.style.opacity="1";},200);document.getElementById("phn").textContent="0"+(phI+1);document.getElementById("phcap").querySelector("b").textContent=T(PH[phI].c);return;}
  if(t.hasAttribute("data-slide")){slideI=+t.dataset.slide;app.querySelectorAll("[data-slide]").forEach(function(b){b.setAttribute("aria-pressed",String(+b.dataset.slide===slideI));});var st=document.getElementById("slidetxt");st.style.opacity="0";setTimeout(function(){st.innerHTML=slideText();st.style.opacity="1";},180);return;}
  if(t.dataset.track) track(t.dataset.track);
  if(t.dataset.lang){L=t.dataset.lang;try{localStorage.setItem("sath_lang",L);}catch(x){}render(true);return;}
  if(t.dataset.dep!==undefined&&t.hasAttribute("data-dep")){vacDep=t.dataset.dep;app.querySelectorAll("[data-dep]").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.dep===vacDep));});document.getElementById("vac-wrap").innerHTML=vacList();return;}
  if(t.hasAttribute("data-lb")){openLb(+t.dataset.lb);return;}
  var a=t.dataset.act;
  if(a==="menu"){menuOpen=true;document.body.style.overflow="hidden";app.insertAdjacentHTML("beforeend",menuHtml());var c=app.querySelector(".menu [data-act=menu-close]");if(c)c.focus();}
  else if(a==="menu-close"){closeMenu();}
  else if(a==="hide-notice"){noticeHidden=true;try{localStorage.setItem("sath_notice","1");}catch(x){}var n=app.querySelector(".notice");if(n)n.remove();}
  else if(a==="reset-flt"){flt={type:"",svc:"",status:"",year:"",q:""};render(true);}
  else if(a==="form-reset"){formDraft[t.dataset.kind]={};render(true);}
  else if(a==="copy"){var txt=t.dataset.text,orig=t.textContent;
    function ok(){t.textContent=u("copied");setTimeout(function(){t.textContent=orig;},1600);}
    try{navigator.clipboard.writeText(txt).then(ok,function(){fallbackCopy(txt);ok();});}catch(x){fallbackCopy(txt);ok();}}
  else if(a==="lb-close"){closeLb();}
  else if(a==="lb-prev"){stepLb(-1);}
  else if(a==="lb-next"){stepLb(1);}
});
function fallbackCopy(txt){var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(x){}ta.remove();}
function closeMenu(){menuOpen=false;document.body.style.overflow="";var m=app.querySelector(".menu");if(m)m.remove();}
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){var cl=document.querySelector(".lb");if(cl&&!lbState){cl.remove();document.body.style.overflow="";}if(lbState)closeLb();else if(menuOpen)closeMenu();}
  if(lbState&&e.key==="ArrowRight")stepLb(1);
  if(lbState&&e.key==="ArrowLeft")stepLb(-1);
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.flt){flt[t.dataset.flt]=t.value;document.getElementById("pgrid-wrap").innerHTML=projGrid();return;}
  if(t.type==="file"){var f=t.files&&t.files[0],form=t.closest("form"),kind=form.dataset.kind;formDraft[kind]=formDraft[kind]||{};
    var span=form.querySelector("[data-fname]"),wrap=t.closest(".fld"),old=wrap.querySelector(".e");if(old)old.remove();wrap.classList.remove("bad");
    if(f){var okExt=/\.(pdf|jpe?g|png|webp|heic|dwg|dxf|zip|rar|7z|docx?|xlsx?)$/i.test(f.name);if(!okExt||f.size>20*1024*1024){wrap.classList.add("bad");wrap.insertAdjacentHTML("beforeend",'<span class="e">'+u("f_file_err")+'</span>');t.value="";formDraft[kind].fname="";span.textContent=u("f_file_note");return;}
      formDraft[kind].fname=f.name+" · "+(f.size/1048576).toFixed(1)+" MB";span.textContent=formDraft[kind].fname;}
    return;}
  saveDraft(t);
});
var started={};
document.addEventListener("input",function(e){
  if(e.target.id==="bxr"){bxV=+e.target.value;e.target.parentNode.style.setProperty("--x",bxV+"%");return;}
  var t=e.target;
  if(t.id==="flt-q"){flt.q=t.value;document.getElementById("pgrid-wrap").innerHTML=projGrid();return;}
  var form=t.closest&&t.closest("form.lead");if(form&&!started[form.dataset.kind]){started[form.dataset.kind]=1;track("form_start",{form:form.dataset.kind});}
  saveDraft(t);
});
function saveDraft(t){var form=t.closest&&t.closest("form.lead");if(!form||!t.name||t.name==="website"||t.type==="file")return;var k=form.dataset.kind;formDraft[k]=formDraft[k]||{};formDraft[k][t.name]=t.type==="checkbox"?t.checked:t.value;
  var w=t.closest(".fld");if(w&&w.classList.contains("bad")){w.classList.remove("bad");var er=w.querySelector(".e");if(er)er.remove();}}
document.addEventListener("submit",function(e){
  var form=e.target;if(!form.classList.contains("lead"))return;e.preventDefault();
  var kind=form.dataset.kind,career=kind==="career",f=form.elements,errs=[];
  if(f.website&&f.website.value) return;
  form.querySelectorAll(".fld.bad").forEach(function(w){w.classList.remove("bad");var x=w.querySelector(".e");if(x)x.remove();});
  function bad(el,msg){var w=el.closest(".fld");w.classList.add("bad");w.insertAdjacentHTML("beforeend",'<span class="e">'+msg+'</span>');errs.push(el);}
  if(!f.name.value.trim()) bad(f.name,u("f_req"));
  if(f.phone.value.replace(/\D/g,"").length<9) bad(f.phone,u("f_phone_err"));
  if(f.email.value.trim()&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email.value.trim())) bad(f.email,u("f_email_err"));
  if(!career&&!f.type.value) bad(f.type,u("f_req"));
  if(!f.msg.value.trim()) bad(f.msg,u("f_req"));
  if(!f.consent.checked) bad(f.consent,u("f_consent_err"));
  if(errs.length){errs[0].focus();return;}
  formDraft[kind]=formDraft[kind]||{};formDraft[kind].done=true;
  track(career?"career_submit":"form_submit",{form:kind});
  var y=form.getBoundingClientRect().top+window.scrollY-100;
  render(true);window.scrollTo(0,y);
  var st=app.querySelector("#form-"+kind+" .done");if(st){st.setAttribute("tabindex","-1");st.focus({preventScroll:true});}
});

/* lightbox */
function curProject(){var m=routeName.match(/^project-(.+)$/);return m?prjBy(m[1]):null;}
function openLb(i){var p=curProject();if(!p)return;lbState={i:i,p:p};drawLb();document.body.style.overflow="hidden";}
function drawLb(){var old=document.querySelector(".lb");if(old)old.remove();var s=lbState,n=s.p.gal.length,k=s.p.gal[s.i];
  document.body.insertAdjacentHTML("beforeend",'<div class="lb" role="dialog" aria-modal="true" aria-label="'+u("gallery")+'"><div class="lbtop"><span>'+T(s.p.t)+' · '+(s.i+1)+' '+u("of")+' '+n+'</span><button type="button" data-act="lb-close" aria-label="'+u("close")+'">'+u("close")+' ✕</button></div><div class="stage"><img src="img/'+k+'-1800.jpg" alt="'+esc(T(s.p.t))+'"></div><div class="nav2"><button type="button" data-act="lb-prev">← '+u("prev")+'</button><button type="button" data-act="lb-next">'+u("next")+' →</button></div></div>');
  var c=document.querySelector(".lb [data-act=lb-close]");if(c)c.focus();}
function stepLb(d){var n=lbState.p.gal.length;lbState.i=(lbState.i+d+n)%n;drawLb();}
function closeLb(){lbState=null;var el=document.querySelector(".lb");if(el)el.remove();document.body.style.overflow="";}

window.SATH_EXPORT=function(){return {SITE:SITE,P:P,ARTICLES:ARTICLES,TEAM:TEAM,CERTS:CERTS,VAC:VAC,VIDEOS:VIDEOS};};
function applyContent(d){
  if(!d||typeof d!=="object")return;
  function vis(a){return Array.isArray(a)?a.filter(function(x){return x&&!x.hidden;}):null;}
  if(d.SITE&&typeof d.SITE==="object"){for(var k in d.SITE){if(Object.prototype.hasOwnProperty.call(d.SITE,k))SITE[k]=d.SITE[k];}}
  var a;
  if((a=vis(d.P))&&a.length){a.forEach(function(p){p.gal=p.gal&&p.gal.length?p.gal:[p.img];p.svc=p.svc||[];if(!TYPES[p.type])p.type="public";});P=a;}
  if((a=vis(d.ARTICLES)))ARTICLES=a.map(function(x){x.b=x.b||{ru:[]};x.min=x.min||3;x.k=x.k||"tower";x.seed=x.seed||7;x.cat=x.cat||{ru:""};return x;});
  if((a=vis(d.TEAM)))TEAM=a.map(function(m){m.c=m.c||[];return m;});
  if((a=vis(d.CERTS)))CERTS=a.map(function(c){c.pages=c.pages&&c.pages.length?c.pages:[c.img];return c;});
  if((a=vis(d.VAC)))VAC=a;
  if((a=vis(d.VIDEOS)))VIDEOS=a.filter(function(v){return v.src;});
}
var boot=false;function go(){if(boot)return;boot=true;render(false);}
try{
  var ctl=typeof AbortController!=="undefined"?new AbortController():null;
  setTimeout(function(){if(ctl)ctl.abort();go();},4000);
  fetch("data/content.json?v="+Date.now(),{cache:"no-store",signal:ctl?ctl.signal:undefined}).then(function(r){return r.ok?r.json():null;}).then(function(d){try{applyContent(d);}catch(e){}go();}).catch(function(){go();});
}catch(e){go();}
})();
</script>
